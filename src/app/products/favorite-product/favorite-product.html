<h3 class="my-4">Favorites</h3>
@for (fav of data; track $index) {
<div class="p-2 border border-info row align-items-center">
  <p class="col-4 m-0">{{ fav.title }}</p>
  <p class="col-2 m-0 border-start border-2">{{ fav.price }}$</p>
  <p class="col-3 m-0 border-start border-2">{{ fav.discountPercentage }}% OFF!</p>

  <div class="col-3 border-start border-2 d-flex justify-content-center">
    <button class="btn btn-danger px-3" (click)="deleteFromFavorite($index)">Delete</button>
  </div>
</div>
}
