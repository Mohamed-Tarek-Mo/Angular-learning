<div class="my-5">
  <h3 class="mb-4">Products Cart</h3>
  <div class="row">
    @for (item of data; track $index) {
    <div class="p-2 border border-info row align-items-center">
      <p class="col-9 m-0">{{ item }}</p>
      <div class="col-3 border-start border-2 d-flex justify-content-center">
        <button class="btn btn-danger px-3" (click)="deleteFromCart($index)">Delete</button>
      </div>
    </div>
    }
  </div>
</div>
